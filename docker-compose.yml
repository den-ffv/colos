version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: colos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: colos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: colos-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/colos?schema=public
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 4000
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
    depends_on:
      - db
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      args:
        # Це значення "вшивається" у Vite build і має бути доступним з браузера.
        # Для локального запуску через docker compose це host-порти.
        VITE_API_URL: http://localhost:4000
    container_name: colos-client
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  pgdata:
