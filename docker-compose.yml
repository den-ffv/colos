version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: colos-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: colos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: colos-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/colos?schema=public
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 4000
    depends_on:
      - db
    ports:
      - "4000:4000"

  client:
    build: ./client
    container_name: colos-client
    environment:
      VITE_API_URL: http://server:4000
    depends_on:
      - server
    ports:
      - "5173:5173"

volumes:
  pgdata:
